  <circle cx="958" cy="111.5" r="1.5" fill="white"/><circle cx="964" cy="111.5" r="1.5" fill="white"/><circle cx="970" cy="111.5" r="1.5" fill="white"/>
  <text x="996" y="122" fill="white" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700">Join Discord</text>
