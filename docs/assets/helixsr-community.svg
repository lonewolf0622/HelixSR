  </defs>
  <rect x="1" y="1" width="1278" height="226" rx="20" fill="url(#bg)" stroke="#35415E"/>
  <path d="M42 59V169" stroke="url(#edge)" stroke-width="3" stroke-linecap="round"/>
  <text x="70" y="60" fill="#9DAAD0" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" letter-spacing="3">BUILDING BETTER TOGETHER</text>
  <text x="68" y="116" fill="#F3F5FF" font-family="Arial,Helvetica,sans-serif" font-size="40" font-weight="700" letter-spacing="-1">Your hardware. Your feedback.</text>
