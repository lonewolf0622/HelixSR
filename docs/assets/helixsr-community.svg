<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="228" viewBox="0 0 1280 228" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Join the HelixSR community on Discord</title>
  <desc id="desc">Get help, share your results, and help shape what comes next. Click this banner to join the HelixSR Discord server.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="228" gradientUnits="userSpaceOnUse"><stop stop-color="#111B2C"/><stop offset="1" stop-color="#17162E"/></linearGradient>
