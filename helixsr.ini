; helixsr.ini - optional, next to the upscaler DLL. Every key has a default.

[Sharpening]
; game     = use the game's FSR sharpening setting; if the game sends none, use Sharpness below
; override = always use Sharpness below
; off      = never sharpen (default: DLSS's network does not sharpen)
Mode = off
; 0.0 - 1.0 (FidelityFX scale: 0 = none, 1 = strongest RCAS)
Sharpness = 0.3
; Less sharpening on fast-moving pixels (uses the game's motion vectors)
MotionAdaptive = true
; Motion in output pixels per frame where the reduction starts / is complete
MotionThreshold = 2
MotionLimit = 16
; Fraction of sharpening removed at and above MotionLimit (0 - 1)
MotionReduction = 0.6

[Upscaling]
; Size the network works at.
;   auto    as NVIDIA's DLSS, except Ultra Performance: the network outputs NetworkScale x the render size (2: 720p ->
;           1440p at 4K) and a final pass scales that to the screen; the full-size network is grainier there
;   full    always the screen size (as HelixSR 1.2)
; QSSM (Quality Super-Sampled Mode): the network outputs MORE than the screen, then the final pass scales it down.
; Cleaner edges and less shimmer; costs more GPU time. Not at Ultra Performance (at most 3x the render size).
;   QSSM Ultra 1.25x | QSSM High 1.20x | QSSM Balanced 1.15x | QSSM Light 1.10x | QSSM Eco 1.05x |
;   QSSM Min 1.025x   (QSSM = Ultra)
; PRSM (Performance Reduced-Sample Mode): the network outputs LESS than the screen, then the final pass scales it
; up. Faster, softer. Never below 1.5x the render size (smaller would be slower), so the in-game Quality mode stays
; at the screen size.
;   PRSM Light 0.95x | PRSM Quality 0.90x | PRSM Balanced 0.85x | PRSM Performance 0.80x | PRSM Ultra 0.75x |
;   PRSM Extreme 0.70x   (PRSM = Balanced)
; Example, 1440p screen: QSSM Ultra = 3200x1800, QSSM Eco = 2688x1512, PRSM Balanced = 2176x1224.
; QSSM and PRSM only change upscaling modes: native (DLAA, render = screen) always runs at the screen size.
; Not with display-resolution motion vectors (those games always use the screen size).
NetworkResolution = auto
; Optional: any QSSM / PRSM scale instead of the preset's (0.5 - 2.0, x the screen)
;ScreenScale = 1.15
; auto at Ultra Performance: network output / render size (1.0 - 4.0). Suggested: 2.0 (default), 2.25 (1620p at
; 4K), 2.5 (1800p).
;NetworkScale = 2.0

[ModelE]
; Run the Model E network. While kernels are missing the placeholder upscale is used (see the log).
Enabled = true
; auto = the main network at every scale ratio (faster than the Ultra Performance network on GPUs without matrix
;        cores, same look in our tests); nvidia = as NVIDIA's DLSS (Ultra Performance network above a 2.5 ratio);
; or main / ultraperformance
Network = auto
; Sign conventions, if a game's jitter or motion vectors come out mirrored
InvertJitter = false
InvertMotionVectors = false
; Render-resolution motion vectors: false = NVIDIA's own render-resolution input path (default, fastest);
; true = convert them to display resolution first (used anyway when the game's vectors include the jitter)
MotionVectorFrontEnd = false
; Display-resolution motion vectors (games that set FidelityFX's display-resolution flag): false = pass them through as the
; game sends them (default); true = dilate them first (closest depth, as NVIDIA's guide asks of engines), which costs
; about 0.1 ms at 1080p and 0.3 ms at 4K. Try it if moving edges ghost in such a game.
DilateDisplayMotionVectors = false
; The game's reactive mask (particles, animated textures, anything without good motion vectors): true = give it to the
; network's "bias current colour" input, which favours the new frame over history there; false = ignored (default)
UseReactiveMask = false

[Log]
; helixsr.log next to the DLL
Enabled = true

[Compatibility]
; Wave size of the network shaders (32 or 64 lanes per wave). helixsr.log says what was picked and why.
;   auto  by GPU: RDNA 1/2 (Steam Deck, RX 6000, BC-250) wave32; RDNA 3, 3.5 and 4 (RX 7000/9000, ROG Ally, 780M/890M)
;         wave64 for the network shaders, which avoids an image problem reported with wave32 on those GPUs
;   32    wave32 (fastest where it works correctly)
;   64    wave64 (same image, about 5% slower)
; GPUs without 32-lane waves (Vega, Radeon VII) are not supported in this version.
WaveSize = auto

[Forwarding]
; DLL that serves FidelityFX effects other than upscaling (frame generation, ...).
; Default: amd_fidelityfx_dx12.original.dll if present, else amd_fidelityfx_framegeneration_dx12.dll.
Dll =
; Optional: another FidelityFX upscaler DLL (e.g. AMD's amd_fidelityfx_upscaler_dx12.dll with FSR 4). Its upscalers
; are listed after HelixSR (OptiScaler: "FFX Upscaler" menu), and the one you pick runs in that DLL.
; A name without a folder is looked up next to HelixSR. Empty (default): HelixSR only.
UpscalerDll =
